global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The app running in docker compose.
  - job_name: observability-lab
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  # The app started locally with `dotnet run` (docker-compose.dev.yml). "Down" is normal otherwise.
  - job_name: observability-lab-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5253"]

  # RabbitMQ built-in Prometheus plugin: node-wide totals (connections, channels, global message rates, memory).
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  # ...and the same plugin per queue (messages ready/unacked, consumers, consumer utilisation).
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count, queue_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
